<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'"
    />
    <title>Scoreko - Startup Error</title>
    <style>
      :root {
        --primary: #E66B3C;
        --primary-hover: #cc5a2e;
        --text-base: rgba(255, 255, 255, 0.92);
        --text-muted: rgba(255, 255, 255, 0.7);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --bg-subtle: rgba(255, 255, 255, 0.05);
        --glass-bg: rgba(18, 18, 24, 0.75);
        --negative: #FF5252;
        --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
      }

      body {
        background-color: #121212;
        background-image: radial-gradient(ellipse at 50% 40%, rgba(230, 107, 60, 0.06) 0%, transparent 70%);
        color: var(--text-base);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        overflow: hidden;
        user-select: none;
      }

      .error-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .error-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 560px;
        width: 100%;
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border-subtle);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        padding: 32px 28px;
      }

      .error-icon {
        width: 56px;
        height: 56px;
        color: var(--negative);
        flex-shrink: 0;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0;
        color: var(--text-base);
      }

      .error-message {
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--text-muted);
        margin: 0;
        word-break: break-word;
        max-height: 220px;
        overflow-y: auto;
        background: var(--bg-subtle);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        padding: 12px 16px;
        text-align: left;
        font-family: var(--font-mono);
        white-space: pre-wrap;
        width: 100%;
        box-sizing: border-box;
      }

      .hint {
        font-size: 0.8125rem;
        color: var(--text-muted);
        margin: 0;
        opacity: 0.7;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 8px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 6px;
        padding: 10px 20px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      button:active {
        transform: scale(0.95);
      }

      #btn-logs {
        background: var(--bg-subtle);
        color: var(--text-base);
        border: 1px solid var(--border-subtle);
      }

      #btn-logs:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      #btn-quit {
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 4px 12px rgba(230, 107, 60, 0.2);
      }

      #btn-quit:hover {
        background: var(--primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(230, 107, 60, 0.35);
      }

      #btn-quit:active {
        transform: scale(0.95);
        box-shadow: 0 2px 8px rgba(230, 107, 60, 0.15);
      }

      ::-webkit-scrollbar {
        width: 4px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-subtle);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="error-page">
      <div class="error-content">
        <svg
          class="error-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>

        <h1 id="error-title">Scoreko failed to start</h1>

        <pre class="error-message" id="error-detail">
An unexpected error occurred while starting the internal server.</pre>

        <p class="hint">
          Check the logs for more details or restart the application.
        </p>

        <div class="actions">
          <button id="btn-logs">View Logs</button>
          <button id="btn-quit">Quit Scoreko</button>
        </div>
      </div>
    </div>

    <script>
      try {
        const hash = decodeURIComponent(window.location.hash.slice(1));
        const params = new URLSearchParams(hash);
        const msg = params.get("msg");
        if (msg) {
          document.getElementById("error-detail").textContent = msg;
        }
      } catch (_) {}

      document.getElementById("btn-quit").addEventListener("click", () => {
        window.close();
      });

      document.getElementById("btn-logs").addEventListener("click", () => {
        window.location.href = "app://open-logs";
      });
    </script>
  </body>
</html>
