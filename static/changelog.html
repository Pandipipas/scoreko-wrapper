<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; img-src * data:;"
    />
    <title>Scoreko - What's New</title>
    <style>
      :root {
        --primary: #E66B3C;
        --primary-hover: #cc5a2e;
        --text-base: rgba(255, 255, 255, 0.92);
        --text-muted: rgba(255, 255, 255, 0.7);
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-medium: rgba(255, 255, 255, 0.34);
        --bg-subtle: rgba(255, 255, 255, 0.05);
        --glass-bg: rgba(18, 18, 24, 0.75);
        --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
      }

      body {
        background-color: #121212;
        background-image: radial-gradient(ellipse at 50% 20%, rgba(230, 107, 60, 0.06) 0%, transparent 70%);
        color: var(--text-base);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        margin: 0;
        overflow-y: auto;
        padding: 32px;
      }

      .wrapper {
        max-width: 720px;
        margin: 0 auto;
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border-subtle);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        padding: 28px 32px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 16px;
      }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
      }
      h1 {
        margin: 0;
        color: var(--primary);
        font-size: 1.5rem;
      }

      .content {
        line-height: 1.6;
        color: var(--text-base);
      }
      .content a {
        color: var(--primary);
        text-decoration: none;
        transition: opacity 0.15s ease;
      }
      .content a:hover {
        opacity: 0.8;
      }
      .content h1,
      .content h2,
      .content h3 {
        color: #fff;
      }
      .content code {
        background: var(--bg-subtle);
        border: 1px solid var(--border-subtle);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 0.875em;
      }
      .content pre {
        background: var(--bg-subtle);
        border: 1px solid var(--border-subtle);
        padding: 14px 16px;
        border-radius: 8px;
        overflow-x: auto;
        font-family: var(--font-mono);
        font-size: 0.875em;
      }
      .content pre code {
        background: none;
        border: none;
        padding: 0;
      }
      .content blockquote {
        border-left: 4px solid var(--primary);
        margin: 0;
        padding-left: 16px;
        color: var(--text-muted);
      }
      .content ul, .content ol {
        padding-left: 20px;
      }
      .content li {
        margin-bottom: 6px;
      }
      .content hr {
        border: none;
        border-top: 1px solid var(--border-subtle);
        margin: 20px 0;
      }

      .footer {
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid var(--border-subtle);
        text-align: right;
      }
      .btn {
        background-color: var(--primary);
        color: #fff;
        border: none;
        padding: 8px 24px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9375rem;
        font-family: inherit;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(230, 107, 60, 0.2);
      }
      .btn:hover {
        background-color: var(--primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(230, 107, 60, 0.35);
      }
      .btn:active {
        transform: scale(0.95);
        box-shadow: 0 2px 8px rgba(230, 107, 60, 0.15);
      }

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-subtle);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="header">
        <img src="icons/icon.png" class="logo" alt="Scoreko Logo" />
        <h1>Scoreko Has Been Updated</h1>
      </div>
      <div class="content" id="changelogContent">Loading...</div>
      <div class="footer">
        <button class="btn" id="closeBtn">Close</button>
      </div>
    </div>
    <script src="lib/purify.min.js"></script>
    <script>
      document.getElementById("closeBtn").addEventListener("click", () => {
        window.close();
      });

      window.electronAPI.onChangelog((html) => {
        const contentDiv = document.getElementById("changelogContent");
        if (contentDiv) {
          contentDiv.innerHTML = DOMPurify.sanitize(html);
        }
      });
    </script>
  </body>
</html>
